[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "siamese-face"
version = "2.0.0"
description = "Xác minh khuôn mặt one-shot bằng mạng nơ-ron Siamese"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "tensorflow>=2.13",
    "numpy>=1.23",
    "opencv-python>=4.5",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.5"]
test = ["pytest>=7.0"]

[project.scripts]
siamese-face = "siamese_face.cli:main"

[tool.setuptools]
packages = ["siamese_face"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
